name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Compile SQL
        run: go tool sqlc compile

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate shell scripts
        run: find internal/scripts -type f -name '*.sh' -exec bash -n {} \;

      - name: Build API image
        run: docker build --tag podlet-api:test .
