name: podlet

services:
  db:
    image: postgres:17
    restart: no
    env_file:
      - .env
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      retries: 30

volumes:
  pgdata:
    name: podlet-postgres-data
