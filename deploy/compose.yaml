name: podlet

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${API_IMAGE}
    restart: "no"
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PGUSER="$${POSTGRES_USER}"
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        export PGDATABASE="$${POSTGRES_DB}"
        exec /usr/local/bin/goose -dir /app/sql/migrations postgres "" up

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      BASE_URL: http://0.0.0.0:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      GITHUB_PRIVATE_KEY: /opt/podlet/podlet-local-dev.private-key.pem
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    volumes:
      - /opt/podlet/podlet-local-dev.private-key.pem:/opt/podlet/podlet-local-dev.private-key.pem:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

